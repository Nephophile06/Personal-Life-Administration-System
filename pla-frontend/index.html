  <script>
    // Set the paper colour before first paint — no flash of the wrong theme.
    (function () {
      try {
        var pref = localStorage.getItem('pla.theme') || 'auto';
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = pref === 'auto' ? (dark ? 'dark' : 'light') : pref;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePref = pref;
        var accent = localStorage.getItem('pla.accent');
        if (accent) document.documentElement.dataset.accent = accent;
      } catch (e) {
        /* default light paper is fine */
      }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app" class="app"></div>

  <noscript>
    <div style="max-width: 34rem; margin: 12vh auto; padding: 2rem; text-align: center; font-family: Georgia, serif">
      <h1 style="font-size: 2rem">Puffy needs JavaScript</h1>
      <p style="margin-top: .75rem; line-height: 1.5">This planner keeps everything in your browser. Turn JavaScript on, then reload the page.</p>
    </div>
  </noscript>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
